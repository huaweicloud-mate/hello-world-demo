name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: huaweicloud-mate/.github/actions/issue-bot@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}

      - name: Auto Assign & Notify
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const labels = (issue.labels || []).map(l => l.name);
            if (issue.assignees && issue.assignees.length > 0) {
              console.log('Already assigned, skipping');
              return;
            }

            const assignee = 'shuangheaven';
            console.log(`Auto-assign: ${assignee}`);
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [assignee]
              });
              console.log('Assigned successfully');
            } catch (e) {
              console.log(`Assign skipped: ${e.message}`);
            }

            const fs = require('fs');
            fs.writeFileSync('/tmp/notify.json', JSON.stringify({
              repo: context.repo.repo,
              number: context.issue.number,
              title: issue.title,
              labels: labels.join(', '),
              url: issue.html_url,
              user: issue.user.login,
            }));

      - name: Send Email
        env:
          SUBJECT: "[Issue Triage] ${{ github.repository }}#${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          BODY: |
            Issue assigned
            Repo: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }} ${{ github.event.issue.title }}
            Created by: ${{ github.event.issue.user.login }}
            URL: ${{ github.event.issue.html_url }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_REPORT_TO: ${{ secrets.EMAIL_REPORT_TO }}
        run: |
          pip install requests > /dev/null 2>&1
          python3 -c "
          import os, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.header import Header

          body = os.environ.get('BODY', '')
          subject = os.environ.get('SUBJECT', 'Issue Triage')
          smtp = smtplib.SMTP(os.environ['SMTP_HOST'], int(os.environ.get('SMTP_PORT', '587')), timeout=15)
          smtp.starttls()
          smtp.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])

          msg = MIMEMultipart('alternative')
          msg['From'] = os.environ['SMTP_USER']
          msg['To'] = os.environ.get('EMAIL_REPORT_TO', os.environ['SMTP_USER'])
          msg['Subject'] = Header(subject, 'utf-8')
          html = f'<html><body style="font-family:Arial,sans-serif;max-width:600px"><div style="background:#0366d6;color:#fff;padding:16px;border-radius:8px 8px 0 0"><h2 style="margin:0">Issue Triage Notification</h2></div><div style="border:1px solid #e1e4e8;padding:16px"><pre style="white-space:pre-wrap;font-family:Consolas,monospace">{body}</pre><p><a href=\"'+"'${{ github.event.issue.html_url }}'"+'\" style="background:#2ea44f;color:#fff;padding:8px 16px;text-decoration:none;border-radius:6px">View Issue</a></p></div></body></html>'
          msg.attach(MIMEText(html, 'html', 'utf-8'))
          smtp.sendmail(os.environ['SMTP_USER'], [os.environ.get('EMAIL_REPORT_TO', os.environ['SMTP_USER'])], msg.as_string())
          smtp.quit()
          print('Email sent')
          "