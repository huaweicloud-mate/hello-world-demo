name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: huaweicloud-mate/.github/actions/issue-bot@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}

      - name: Auto Assign
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const labels = (issue.labels || []).map(l => l.name);
            if (issue.assignees && issue.assignees.length > 0) {
              console.log('Already assigned, skipping');
              return;
            }
            const areaMap = {
              'area/api': 'api-maintainer',
              'area/frontend': 'web-maintainer',
              'area/ci-cd': 'devops-maintainer',
              'area/sdk': 'sdk-maintainer',
              'area/security': 'security-maintainer',
              'area/performance': 'performance-maintainer',
            };
            let assignee = 'default-triage';
            for (const [area, user] of Object.entries(areaMap)) {
              if (labels.includes(area)) { assignee = user; break; }
            }
            if (labels.includes('type/bug') && labels.includes('priority/critical')) {
              assignee = 'tech-lead';
            }
            console.log(`Labels: ${labels.join(', ')}`);
            console.log(`Auto-assign: ${assignee}`);
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [assignee]
              });
            } catch (e) {
              console.log(`Assign skipped: ${e.message}`);
            }